<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      text-align: center;
    }

    .label {
      color: #888;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 90px);
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    .description {
      max-width: 580px;
      margin: 0 auto;
      color: #999;
      font-size: 18px;
      line-height: 1.7;
    }

    .line {
      width: 90px;
      height: 1px;
      background: #333;
      margin: 40px auto;
    }

    .footer {
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      .description {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <p class="label">Something New Is Coming</p>

    <h1>Coming Soon.</h1>

    <p class="description">
      We're working on something exciting.
      Our new website is currently under development
      and will be launching soon.
    </p>

    <div class="line"></div>

    <p class="footer">
      Stay tuned for updates.
    </p>

  </main>

</body>
</html>
